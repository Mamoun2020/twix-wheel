<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121011">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twix Wheel">
<title>Twix Store — عجلة السحب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Twix Store · brand tokens (charcoal + logo gold) */
    --charcoal-950: #121011;
    --charcoal-900: #1E1B1C;
    --charcoal-800: #2B2829;
    --charcoal-700: #3B3839;
    --gold-300: #F5CF4F;
    --gold-400: #EBB60B;
    --gold-500: #C8990A;
    --gold-600: #9E7A08;
    --white: #FFFFFF;
    --font: 'Tajawal', 'Segoe UI', Tahoma, system-ui, sans-serif;
    --wheel: min(92vw, 60vh, 720px);
  }
  @supports (height: 1dvh) { :root { --wheel: min(92vw, 60dvh, 720px); } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--white);
    background:
      radial-gradient(70% 45% at 50% 32%, #2E2610 0%, transparent 100%),
      radial-gradient(90% 40% at 50% 100%, rgba(0, 0, 0, 0.5) 0%, transparent 100%),
      var(--charcoal-950);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overscroll-behavior-y: none;
  }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .brand { width: min(100%, 780px); display: flex; align-items: center; gap: 12px 14px; flex-wrap: wrap; }
  .brand .text { flex: 1 1 180px; min-width: 0; }
  .logo { width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; background: var(--white); border: 3px solid var(--gold-400); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 0 6px rgba(235, 182, 11, 0.16); display: grid; place-items: center; }
  .logo img { width: 42px; height: 42px; object-fit: contain; }
  .brand h1 { margin: 0; font-size: clamp(22px, 4vw, 34px); font-weight: 900; line-height: 1.1; white-space: nowrap; }
  .brand p { margin: 2px 0 0; font-size: clamp(13px, 2.4vw, 18px); font-weight: 500; line-height: 1.35; color: rgba(255, 255, 255, 0.72); }
  .chip { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 2px solid rgba(235, 182, 11, 0.42); background: rgba(255, 255, 255, 0.05); color: var(--gold-400); font-family: var(--font); font-weight: 700; font-size: 15px; line-height: 1; white-space: nowrap; cursor: pointer; transition: background 0.15s ease; }
  .chip .pen { display: none; }

  .chip:hover { background: rgba(255, 255, 255, 0.1); }
  .chip svg { width: 18px; height: 18px; stroke: currentColor; }

  .wheel-wrap { position: relative; width: var(--wheel); height: var(--wheel); margin-top: 18px; }
  .disc {
    position: absolute; inset: 0; border-radius: 50%;
    border: calc(var(--wheel) * 0.013) solid var(--gold-400);
    background: var(--charcoal-900);
    box-shadow: 0 0 0 calc(var(--wheel) * 0.01) var(--charcoal-900), 0 0 0 calc(var(--wheel) * 0.013) rgba(235, 182, 11, 0.35), 0 30px 70px rgba(0, 0, 0, 0.6);
    overflow: hidden; will-change: transform;
  }
  .disc svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .labels { position: absolute; inset: 0; }
  .arm { position: absolute; left: 0; top: 50%; width: 100%; }
  .arm span { position: absolute; top: 50%; transform: translateY(-50%); width: 34%; text-align: center; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55); }
  /* When many names make on-wheel labels illegible (e.g. on phones), we hide
     them and surface the count + winner instead. */
  .count-badge { display: none; }
  body.labels-hidden .count-badge { display: inline-flex; align-items: center; gap: 8px; margin-top: 2px; padding: 8px 16px; border-radius: 999px; background: rgba(235, 182, 11, 0.14); border: 1.5px solid rgba(235, 182, 11, 0.4); color: var(--gold-300); font-weight: 800; font-size: clamp(14px, 3.4vw, 18px); }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 18%; text-align: center; color: rgba(255, 255, 255, 0.6); font-weight: 700; font-size: clamp(14px, 2.6vw, 22px); line-height: 1.5; }
  .empty[hidden] { display: none; }
  .hub { position: absolute; top: 50%; left: 50%; width: 21%; height: 21%; transform: translate(-50%, -50%); border-radius: 50%; background: var(--white); border: calc(var(--wheel) * 0.008) solid var(--gold-400); box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55); display: grid; place-items: center; }
  .hub img { width: 62%; height: 62%; object-fit: contain; }
  .pointer { position: absolute; top: -3.5%; left: 50%; width: 10%; transform: translateX(-50%); filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.6)); }

  .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 12px; width: 100%; }
  .btn-spin {
    display: inline-flex; align-items: center; gap: 12px; padding: 16px 44px; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-300) 0%, var(--gold-400) 55%, var(--gold-600) 100%);
    color: var(--charcoal-950); font-family: var(--font); font-size: clamp(20px, 3.4vw, 28px); font-weight: 800; line-height: 1;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 0 8px rgba(235, 182, 11, 0.16); cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-spin svg { width: 26px; height: 26px; stroke: var(--charcoal-950); }
  .btn-spin:hover { transform: translateY(-2px); }
  .btn-spin:active { transform: translateY(1px); }
  .btn-spin:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .btn-spin.is-spinning svg { animation: turn 1s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .hint { margin: 0; font-size: clamp(14px, 2.4vw, 18px); color: rgba(255, 255, 255, 0.6); font-weight: 500; text-align: center; }

  .winner {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 40px 18px; border-radius: 24px;
    background: linear-gradient(180deg, var(--gold-300) 0%, var(--gold-400) 55%, var(--gold-600) 100%);
    color: var(--charcoal-950); text-align: center; max-width: min(100%, 640px);
    animation: winner-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both, winner-pulse 2.4s ease-in-out 0.5s infinite;
  }
  .winner[hidden] { display: none; }
  .winner .label { font-size: clamp(14px, 2.4vw, 18px); font-weight: 700; opacity: 0.8; }
  .winner .name { font-size: clamp(28px, 6vw, 46px); font-weight: 900; line-height: 1.15; word-break: break-word; }
  .winner .congrats { font-size: clamp(16px, 2.6vw, 20px); font-weight: 700; }
  .winner .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
  .btn-ghost { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 2px solid rgba(18, 16, 17, 0.35); background: transparent; color: var(--charcoal-950); font-family: var(--font); font-size: 15px; font-weight: 700; line-height: 1; cursor: pointer; transition: background 0.15s ease; }
  .btn-ghost:hover { background: rgba(18, 16, 17, 0.1); }
  .btn-ghost svg { width: 18px; height: 18px; stroke: currentColor; }
  @keyframes winner-in { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
  @keyframes winner-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(235, 182, 11, 0), 0 24px 48px rgba(0, 0, 0, 0.45); } 50% { box-shadow: 0 0 0 14px rgba(235, 182, 11, 0.16), 0 24px 48px rgba(0, 0, 0, 0.45); } }

  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.72); display: grid; place-items: center; padding: 16px; }
  .modal[hidden] { display: none; }
  .panel { width: min(100%, 560px); background: var(--charcoal-900); border: 2px solid rgba(235, 182, 11, 0.35); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6); }
  .panel h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--gold-400); }
  .panel p { margin: 0; font-size: 15px; color: rgba(255, 255, 255, 0.6); }
  .panel textarea { width: 100%; height: min(46vh, 340px); resize: vertical; padding: 14px 16px; border-radius: 16px; border: 2px solid rgba(235, 182, 11, 0.35); background: rgba(255, 255, 255, 0.05); color: var(--white); font-family: var(--font); font-size: 18px; line-height: 1.5; direction: rtl; }
  .panel textarea:focus { outline: none; border-color: var(--gold-400); box-shadow: 0 0 0 4px rgba(235, 182, 11, 0.18); }
  .panel .row { display: flex; justify-content: flex-start; gap: 10px; flex-wrap: wrap; }
  .btn-primary { padding: 12px 22px; border: 0; border-radius: 999px; background: linear-gradient(180deg, var(--gold-300), var(--gold-400) 55%, var(--gold-600)); color: var(--charcoal-950); font-family: var(--font); font-size: 17px; font-weight: 800; cursor: pointer; }
  .btn-secondary { padding: 12px 22px; border-radius: 999px; border: 2px solid rgba(235, 182, 11, 0.42); background: transparent; color: var(--gold-400); font-family: var(--font); font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  .ribbons { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .brand, .wheel-wrap, .controls { position: relative; z-index: 1; }

  /* ── phones (iPhone 11: 414 × 896) ── everything fits one screen, no scrolling ── */
  @media (max-width: 480px) {
    :root { --wheel: min(92vw, 46vh); }
    @supports (height: 1dvh) { :root { --wheel: min(92vw, 46dvh); } }
    body { gap: 10px; padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .brand { flex-wrap: nowrap; gap: 10px; }
    .logo { width: 52px; height: 52px; border-width: 2.5px; } .logo img { width: 34px; height: 34px; }
    .brand h1 { font-size: 22px; } .brand p { font-size: 13px; }
    .chip { flex: 0 0 auto; padding: 9px 11px; font-size: 14px; gap: 6px; }
    .chip .lbl, .chip .sep { display: none; } .chip .pen { display: block; }
    .wheel-wrap { margin-top: 8px; }
    .controls { gap: 8px; margin-top: 6px; }
    .btn-spin { padding: 14px 38px; font-size: 22px; gap: 10px; } .btn-spin svg { width: 22px; height: 22px; }
    .hint { font-size: 14px; }
    .winner { padding: 10px 16px 12px; border-radius: 18px; gap: 1px; }
    .winner .label, .winner .congrats { font-size: 14px; }
    .winner .name { font-size: 30px; }
    .winner .actions { gap: 8px; margin-top: 8px; }
    .btn-ghost { padding: 8px 11px; font-size: 13px; }
    .btn-ghost .long { display: none; }
    .panel { padding: 16px; border-radius: 20px; } .panel h2 { font-size: 20px; } .panel textarea { height: 38vh; font-size: 17px; }
  }
  /* phone held sideways: put the wheel and the controls side by side */
  @media (max-height: 480px) and (orientation: landscape) {
    :root { --wheel: min(66vh, 56vw); }
    @supports (height: 1dvh) { :root { --wheel: min(66dvh, 56vw); } }
    body { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto 1fr; align-items: center; column-gap: 20px; row-gap: 6px; padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .brand { grid-column: 1 / -1; }
    .wheel-wrap { grid-row: 2; margin-top: 6px; }
    .controls { grid-column: 2; grid-row: 2; margin-top: 0; gap: 10px; }
    .btn-spin { padding: 12px 34px; font-size: 22px; }
    .winner { padding: 10px 20px 12px; gap: 1px; } .winner .name { font-size: 30px; } .winner .label, .winner .congrats { font-size: 14px; } .winner .actions { margin-top: 8px; } .btn-ghost { padding: 8px 12px; font-size: 13px; }
  }
</style>
</head>

  function parse(text) {
    var seen = {}, out = [];
    String(text || '').split(/[\n,،]+/).forEach(function (raw) {
      var name = raw.trim(), key = name.toLowerCase();
      if (name && !seen[key]) { seen[key] = true; out.push(name); }
    });
    return out;
  }
  function polar(cx, cy, r, deg) { var rad = deg * Math.PI / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; }
  function fmt(v) { return Math.round(v * 100) / 100; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // الشرائح تُرسم بـ SVG، والأسماء نص HTML عادي يُدار بالـ CSS مع كل شريحة
  function render() {
    var n = names.length;
    countEl.textContent = n + ' مشارك';
    spinBtn.disabled = n === 0 || spinning;
    empty.hidden = n > 0;
    if (!n) { slices.innerHTML = ''; labels.innerHTML = ''; return; }
    var size = Math.max(1, disc.clientWidth), s = size / 600;
    // Would the on-wheel labels be legible at this wheel size + count? If the
    // best-fit font drops below ~8px (e.g. many names on a phone), hide them and
    // show the count badge instead — the winner is announced big regardless.
    var fsForN = Math.min(30, 0.8 * 2 * Math.PI * 185 / n);
    var showLabels = (fsForN * s) >= 8;
    document.body.classList.toggle('labels-hidden', !showLabels);
    var cb = $('#countBadge'); if (cb) cb.textContent = n + ' مشارك';
    var a = 360 / n, paths = '';
    var frag = document.createDocumentFragment();
    names.forEach(function (name, i) {
      var start = -90 + i * a, end = start + a, d;
      if (n === 1) {
        d = 'M 0 300 A 300 300 0 1 0 600 300 A 300 300 0 1 0 0 300 Z';
      } else {
        var p1 = polar(300, 300, 300, start), p2 = polar(300, 300, 300, end);
        d = 'M 300 300 L ' + fmt(p1[0]) + ' ' + fmt(p1[1]) + ' A 300 300 0 ' + (a > 180 ? 1 : 0) + ' 1 ' + fmt(p2[0]) + ' ' + fmt(p2[1]) + ' Z';
      }
      var isLast = n % 2 === 1 && i === n - 1;
      var gold = i % 2 === 0 && !isLast;
      var fill = isLast ? '#1E1B1C' : (gold ? GOLD[Math.floor(i / 2) % 2] : CHARCOAL[Math.floor(i / 2) % 2]);
      paths += '<path d="' + d + '" fill="' + fill + '" stroke="#121011" stroke-width="2"></path>';

      var mid = start + a / 2, norm = ((mid % 360) + 360) % 360;
      var flip = norm > 90 && norm < 270;
      var rot = flip ? mid + 180 : mid;
      if (showLabels) {
        var label = name.length > 18 ? name.slice(0, 17) + '…' : name;
        var fs = Math.max(11, Math.min(30, Math.floor(0.8 * 2 * Math.PI * 185 / n)));
        fs = Math.min(fs, Math.max(11, Math.floor(190 / (label.length * 0.52))));
        var px = Math.max(9, Math.round(fs * s)), h = Math.round(px * 1.6);
        var color = gold ? '#121011' : '#F5CF4F';
        var arm = document.createElement('div');
        arm.className = 'arm';
        arm.style.height = h + 'px';
        arm.style.marginTop = (-h / 2) + 'px';
        var c = document.createElement('span');
        c.textContent = label;
        c.style.fontSize = px + 'px';
        c.style.color = color;
        if (n === 1) {
          c.style.left = '33%';
        } else {
          arm.style.transform = 'rotate(' + fmt(rot) + 'deg)';
          c.style.left = (flip ? 6 : 60) + '%';

        arm.appendChild(c);
        frag.appendChild(arm);
      }

    labels.appendChild(frag);

  function hideWinner() { winner = null; winnerEl.hidden = true; hint.hidden = false; }

  function announce(name) {
    winner = name;

  function spin() {
    if (spinning || !names.length) return;
    var n = names.length, a = 360 / n;
    var i = Math.floor(Math.random() * n);
    var u = a * (0.15 + Math.random() * 0.7);
    var desired = (360 - (i * a + u)) % 360;
    var cur = ((angle % 360) + 360) % 360;
    var delta = (((desired - cur) % 360) + 360) % 360;
    var turns = 6 + Math.floor(Math.random() * 3);
    var target = angle + turns * 360 + delta;
    spinning = true;
    hideWinner();
    hint.textContent = 'جاري السحب…';
    spinBtn.disabled = true;
    spinBtn.classList.add('is-spinning');
    disc.style.transition = 'transform ' + SPIN_MS + 'ms cubic-bezier(0.12, 0.64, 0.04, 1)';
    void disc.offsetWidth;
    disc.style.transform = 'rotate(' + target + 'deg)';
    angle = target;
    var done = false;
    var finish = function () {
      if (done) return;
      done = true;
      spinning = false;
      spinBtn.classList.remove('is-spinning');
      spinBtn.disabled = names.length === 0;
      hint.textContent = 'اضغط «لفّ العجلة» لاختيار الفائز';
      var finalAngle = ((angle % 360) + 360) % 360;
      var idx = Math.floor((((360 - finalAngle) % 360) / a)) % n;
      // تثبيت الزاوية ضمن دورة واحدة (نفس الوضع بصريًا) حتى لا تتراكم الأرقام مع كل سحب
      disc.style.transition = 'none';
      angle = finalAngle;
      disc.style.transform = 'rotate(' + angle + 'deg)';
      void disc.offsetWidth;
      announce(names[idx]);
    };
    disc.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, SPIN_MS + 250);
  }

  function removeWinner() {
    if (!winner) return;
    var key = winner.toLowerCase(), removed = false;
    names = names.filter(function (x) { if (!removed && x.toLowerCase() === key) { removed = true; return false; } return true; });
    hideWinner();
    render();
  }

  function openModal() { namesTA.value = names.join('\n'); modal.hidden = false; setTimeout(function () { namesTA.focus(); }, 30); }
  function closeModal() { modal.hidden = true; }

  spinBtn.addEventListener('click', spin);
  removeBtn.addEventListener('click', removeWinner);
  againBtn.addEventListener('click', hideWinner);
  editBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  saveBtn.addEventListener('click', function () { names = parse(namesTA.value); hideWinner(); render(); closeModal(); });
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

  // ─── confetti ───
  var cv = $('#confetti'), ctx = cv.getContext('2d'), parts = [], raf = 0;
  function resize() { var dpr = window.devicePixelRatio || 1; cv.width = window.innerWidth * dpr; cv.height = window.innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  window.addEventListener('resize', resize);
  resize();
  function confetti() {
    var colors = ['#EBB60B', '#F5CF4F', '#C8990A', '#FFFFFF', '#3B3839'];
    var rect = disc.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    for (var k = 0; k < 160; k++) {
      var ang = Math.random() * Math.PI * 2, sp = 5 + Math.random() * 10;
      parts.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 5, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, c: colors[k % colors.length], life: 1 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    parts = parts.filter(function (p) { return p.life > 0; });
    parts.forEach(function (p) {
      p.vy += 0.25; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.008;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (parts.length) { raf = requestAnimationFrame(tick); } else { raf = 0; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  render();
  window.addEventListener('resize', render);
  if (document.fonts) {
    document.fonts.ready.then(render);
    document.fonts.addEventListener('loadingdone', render);
  }
})();
</script>
</body>
